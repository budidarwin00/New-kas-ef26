<!DOCTYPE html>
<html lang="id"><head><style>

  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}

  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;

</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAS EF - Anggota</title>
<style>
*{box-sizing:border-box} body{font-family:system-ui,sans-serif;margin:0;background:#F8FAFC;max-width:520px;margin:auto;padding:10px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-bottom:10px}
.badge{font-size:9px;padding:4px 10px;border-radius:999px;font-weight:800;border:1px solid #ddd}
.badge-a{background:#cffafe;color:#0e7490;border-color:#22d3ee}
.saldo{background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff;border-radius:14px;padding:16px}
.btn{border:0;padding:10px 16px;border-radius:999px;font-weight:800;font-size:11px;cursor:pointer}
.tab{padding:10px 18px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;font-weight:800;font-size:12px}
.tab-on{background:#06b6d4;color:#fff;border-color:#06b6d4}
</style></head><body>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<div style="background:#06b6d4;color:#fff;padding:6px 14px;border-radius:999px;font-size:11px;font-weight:900">💧 ANGGOTA - VIEW ONLY</div>
<div style="font-size:9px;color:#666">KAS EF LIVE</div>
</div>
<div class="card" style="display:flex;gap:12px;align-items:center">
<div style="width:50px;height:50px;border-radius:12px;background:linear-gradient(135deg,#06b6d4,#0891b2);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px">EF</div>
<div><div style="font-weight:900">KAS EF</div><div style="font-size:12px;color:#555">PT. Astra Komponen Indonesia</div><span class="badge badge-a" id="count">17 anggota</span></div>
<div style="margin-left:auto"><button class="btn" onclick="sync()" style="background:#fff;border:1px solid #e5e7eb">🔄 Sync</button></div>
</div>
<div style="display:flex;gap:6px;margin-bottom:10px"><button class="tab tab-on" id="t1" onclick="tab('d')">Dashboard</button><button class="tab" id="t2" onclick="tab('a')">Anggota</button><button class="tab" id="t3" onclick="tab('r')">Rekening</button></div>
<div id="vd">
<div class="saldo"><div style="font-size:9px;opacity:.9">SALDO REAL-TIME</div><div id="saldo" style="font-size:28px;font-weight:900;margin-top:4px">Rp 0</div><div id="syncinfo" style="font-size:9px;opacity:.8;margin-top:4px">Sync: -</div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<div class="card" style="margin:0;background:#ecfeff;border-color:#a5f3fc"><div style="font-size:8px;font-weight:800;color:#0e7490">MASUK</div><div id="masuk" style="font-weight:900;color:#059669;margin-top:4px">+ Rp 0</div></div>
<div class="card" style="margin:0;background:#FFF1F2;border-color:#fecaca"><div style="font-size:8px;font-weight:800">KELUAR</div><div id="keluar" style="font-weight:900;color:#dc2626;margin-top:4px">- Rp 0</div></div>
</div>
<div class="card" style="margin-top:10px"><div style="font-weight:900;font-size:12px;margin-bottom:8px">TRANSAKSI - <span id="txc">0</span></div><div id="txlist" style="font-size:11px;color:#666">Memuat...</div></div>
</div>
<div id="va" style="display:none"><div class="card"><div style="font-weight:900">Daftar Anggota</div><div id="alist" style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px"></div></div></div>
<div id="vr" style="display:none"><div class="card"><div style="font-weight:900">Rekening Kas</div><div id="rlist" style="margin-top:10px"></div></div></div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwZyzfPgJiNbBsxwKAfFxnRq2Iz50g9XYvkXU9CJdfywd9bc9n5bGpv7sXyKSOE3Ux72A/exec";
function fmt(n){return n.toLocaleString('id-ID');}
let txs=[], members=[], banks=[];
function tab(x){
 document.getElementById('vd').style.display=x==='d'?'block':'none';
 document.getElementById('va').style.display=x==='a'?'block':'none';
 document.getElementById('vr').style.display=x==='r'?'block':'none';
 document.getElementById('t1').className=x==='d'?'tab tab-on':'tab';
 document.getElementById('t2').className=x==='a'?'tab tab-on':'tab';
 document.getElementById('t3').className=x==='r'?'tab tab-on':'tab';
}
function sync(){
 document.getElementById('syncinfo').textContent='Syncing...';
 fetch(SCRIPT_URL+"?action=getData&t="+Date.now()).then(r=>r.json()).then(d=>{
   let list=d.transaksi||[];
   txs=list.map(x=>{
     let katFull=String(x.Kategori||"Iuran"); let parts=katFull.split("|"); let kat=parts[0].trim();
     return {id:x.ID, date:String(x.Tanggal||"").slice(0,10), cat:kat, amt:parseInt(String(x.Nominal||"").replace(/[^0-9]/g,""))||0, name:String(x.Anggota||""), desc:parts.slice(1).join("|").trim()}
   });
   let masuk=0,keluar=0; txs.forEach(t=>{ if(t.cat==="Kas Keluar") keluar+=t.amt; else masuk+=t.amt; });
   document.getElementById('saldo').textContent='Rp '+fmt(masuk-keluar);
   document.getElementById('masuk').textContent='+ Rp '+fmt(masuk);
   document.getElementById('keluar').textContent='- Rp '+fmt(keluar);
   document.getElementById('txc').textContent=txs.length;
   document.getElementById('syncinfo').textContent='Sync: '+new Date().toLocaleTimeString('id-ID')+' - '+txs.length+' trx';
   let tl=document.getElementById('txlist');
   if(!txs.length) tl.innerHTML='<div style="text-align:center;padding:20px;color:#999">Belum ada transaksi - Saldo Rp 0</div>';
   else tl.innerHTML=txs.slice(0,20).map(t=>'<div style="display:flex;justify-content:space-between;padding:10px;border:1px solid #e5f3ff;background:#F0FDFF;border-radius:10px;margin-bottom:6px"><div><b style="font-size:11px">'+t.name+' • '+t.cat+'</b>'+(t.desc?'<div style="font-size:10px;color:#0e7490">'+t.desc+'</div>':'')+'<div style="font-size:9px;color:#666">'+t.date+' • Rp '+fmt(t.amt)+'</div></div><div style="font-weight:900;color:'+(t.cat==='Kas Keluar'?'#dc2626':'#059669')+'">Rp '+fmt(t.amt)+'</div></div>').join('');
   // anggota
   let raw=d.anggota||[]; members=raw.map(r=>{let nama=String(r.Nama||r.ID||"").trim(); return {name:nama}}).filter(x=>x.name && x.name.toLowerCase()!=='aktif');
   if(!members.length) members=[{name:"Efrizon"},{name:"Kawir"},{name:"Kamal"},{name:"Edy"},{name:"Heri"},{name:"Toni"},{name:"Dayat"},{name:"Aldi"},{name:"Eka Iswanto"},{name:"Ardi"},{name:"Ujang"},{name:"Adhie"},{name:"Alvian"},{name:"Eko"},{name:"Pai"},{name:"Budi"},{name:"Sugiono"}];
   document.getElementById('count').textContent=members.length+' anggota';
   document.getElementById('alist').innerHTML=members.map(m=>'<div style="background:#ecfeff;border:1px solid #22d3ee;border-radius:10px;padding:10px;text-align:center;font-size:12px;font-weight:800;color:#0e7490">'+m.name+'</div>').join('');
   // bank
   let rb=d.bank||[]; banks=rb.map(r=>({name:r.Bank||r.NamaBank||"Bank", number:r.NoRek||r.Rekening||"", owner:r.Pemilik||""})).filter(b=>b.number);
   document.getElementById('rlist').innerHTML=banks.length?banks.map(b=>'<div style="border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-bottom:8px"><div style="font-weight:900;color:#0e7490">'+b.name+' <span style="font-size:9px;background:#06b6d4;color:#fff;padding:2px 6px;border-radius:999px">'+b.owner+'</span></div><div style="font-family:monospace;font-size:18px;font-weight:900;margin-top:6px" onclick="navigator.clipboard.writeText(`'+b.number+'`);alert(`Copy '+b.number+'`)">'+b.number+'</div><div style="font-size:9px;color:#06b6d4">Tap untuk copy</div></div>').join(''):'<div style="color:#999;font-size:11px">Belum ada rekening</div>';
 }).catch(e=>{document.getElementById('syncinfo').textContent='Offline - '+e;});
}
setTimeout(sync,600);
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
