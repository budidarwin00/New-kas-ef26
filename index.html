</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kas EF ANGGOTA FIX SYNC</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;padding:8px;max-width:520px;margin:auto;background:#F0FDF4} .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-bottom:8px}.btn{border-radius:999px;padding:10px 14px;font-size:11px;font-weight:800;border:1px solid #e5e7eb;background:#fff;cursor:pointer;min-height:40px}.btn-teal{background:#06b6d4;color:#fff;border-color:#06b6d4}.tab{padding:10px 18px;border-radius:999px;font-size:12px;font-weight:800;border:1px solid #e5e7eb;background:#fff;cursor:pointer}.tab-active{background:#06b6d4;color:#fff;border-color:#06b6d4}.saldo-anggota{background:linear-gradient(135deg,#06b6d4,#0891b2)!important;color:#fff!important}</style></head><body>

<script>
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbz9hzTgKSYAKp1u39ftbASW4MpM2r4-1M_aWngzoZLSbfl8xYK4VSlo3l-e2xtKHqhM/exec";
var DEFAULT_17_MEMBERS=[{id:"m-nia",name:"Nia"},{id:"m-aditya",name:"Aditya"},{id:"m-anisa",name:"Anisa"},{id:"m-aaf",name:"Aaf"},{id:"m-syarif",name:"Syarif"},{id:"m-budi",name:"Budi"},{id:"m-topik",name:"Topik"},{id:"m-yudi",name:"Yudi"},{id:"m-heru",name:"Heru"},{id:"m-dozen",name:"Dozen"},{id:"m-putri",name:"Putri"},{id:"m-arief",name:"Arief"},{id:"m-anah",name:"Anah"},{id:"m-supriyadi",name:"Supriyadi"},{id:"m-zaelani",name:"Zaelani"},{id:"m-eka",name:"Eka"},{id:"m-nely",name:"Nely"}];
var DEFAULT_BANKS=[{id:"b-eka-bca",name:"BCA",number:"6830747280",owner:"Eka Iswanto"},{id:"b-eka-mandiri",name:"MANDIRI",number:"1570005764080",owner:"Eka Iswanto"}];
var members=DEFAULT_17_MEMBERS.slice();var banks=DEFAULT_BANKS.slice();var txs=[];var filteredTxs=[];var STORAGE_KEY="kas-v84-v2-deskripsi";var isSyncing=false;
function fmt(n){try{return new Intl.NumberFormat("id-ID").format(n||0);}catch(e){return n;}}
function logD(m){var el=document.getElementById('debug-log');if(el)el.innerHTML='['+new Date().toLocaleTimeString()+'] '+m+'<br>'+el.innerHTML;}
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.style.display='block';setTimeout(function(){e.style.display='none';},3000);}
function setTab(t){document.getElementById('view-dashboard').style.display=t==='dashboard'?'block':'none';document.getElementById('view-anggota').style.display=t==='anggota'?'block':'none';document.getElementById('view-rekening').style.display=t==='rekening'?'block':'none';document.getElementById('tab-dashboard').className=t==='dashboard'?'tab tab-active':'tab';document.getElementById('tab-anggota').className=t==='anggota'?'tab tab-active':'tab';document.getElementById('tab-rekening').className=t==='rekening'?'tab tab-active':'tab';}
function copyRek(n,b){if(navigator.clipboard){navigator.clipboard.writeText(n).then(function(){toast('✅ '+n+' disalin');});}var mod=document.getElementById('copy-modal');var inp=document.getElementById('copy-show-input');var lab=document.getElementById('copy-bank-label');if(lab)lab.textContent=b;if(inp)inp.value=n;if(mod)mod.style.display='flex';}
function closeCopyModal(){document.getElementById('copy-modal').style.display='none';}
function copyManualAgain(){var i=document.getElementById('copy-show-input');if(i){i.select();document.execCommand('copy');toast('✅ '+i.value+' disalin');}}
function saveAll(){try{localStorage.setItem(STORAGE_KEY+'-txs',JSON.stringify(txs));localStorage.setItem(STORAGE_KEY+'-members',JSON.stringify(members));localStorage.setItem(STORAGE_KEY+'-banks',JSON.stringify(banks));}catch(e){}}
function exportPDF(){var list=filteredTxs.length?filteredTxs:txs;var html='<h2>Kas EF Anggota</h2><table border=1><tr><th>Nama</th><th>Tgl</th><th>Rp</th></tr>'+list.map(function(t){return '<tr><td>'+t.memberName+'</td><td>'+t.date+'</td><td>'+t.amount+'</td></tr>';}).join('')+'</table>';var blob=new Blob([html],{type:'text/html'});window.open(URL.createObjectURL(blob));}
function syncNow(showToast){
  if(isSyncing)return;isSyncing=true;logD('Fetch getData...');
  fetch(SCRIPT_URL+"?action=getData&t="+Date.now()).then(function(r){return r.text().then(function(txt){logD('Len '+txt.length);return JSON.parse(txt);});}).then(function(d){
    var list=d.transaksi||[];var rawA=d.anggota||[];var rawB=d.bank||[];
    logD('DB: '+list.length+' trx, '+rawA.length+' anggota, '+rawB.length+' bank');
    if(rawA.length>0){
      var fixed=rawA.map(function(r){var id=String(r.ID||"").trim();var nama=String(r.Nama||"").trim();var finalName=nama||id;if(!finalName||finalName.toLowerCase()==='aktif')return null;finalName=finalName.replace(/^(pak|bu)\s+/i,'').trim();if(finalName.toLowerCase()==='opik')finalName='Topik';return {id:"m-"+finalName.toLowerCase().replace(/\s+/g,'-'),name:finalName};}).filter(Boolean);
      var seen={};var dedup=[];fixed.forEach(function(m){var k=m.name.toLowerCase();if(!seen[k]){seen[k]=true;dedup.push(m);}});
      if(dedup.length>0){members=dedup;logD('✅ Anggota Sheet: '+members.map(function(m){return m.name;}).join(', '));var info=document.getElementById('anggota-sync-info');if(info)info.textContent='sync dari Sheet '+members.length+' anggota';}
    }
    if(rawB.length>0){
      var fixedB=rawB.map(function(r){var id=String(r.ID||"").trim();var bank=String(r.Bank||"").trim();var no=String(r["No Rekening"]||r.NoRekening||"").trim();var finalBank=bank||id;var finalNo=no||bank;if(id.toUpperCase()==='BCA'||id.toUpperCase()==='MANDIRI'){return {id:"b-"+id.toLowerCase(),name:id,number:bank||no,owner:r.Pemilik||"Eka Iswanto"};}return {id:"b-"+finalBank.toLowerCase(),name:finalBank,number:finalNo,owner:r.Pemilik||"Eka Iswanto"};}).filter(function(b){return b.number && b.number!=='-';});
      if(fixedB.length>0){banks=fixedB;logD('✅ Bank Sheet: '+banks.length);}
    }
    if(list.length>0){txs=list.map(function(x){var kf=String(x.Kategori||"");var p=kf.split("|");return{id:String(x.ID),date:(x.Tanggal||"").toString().slice(0,10),category:p[0].trim()||"Iuran Bulanan",amount:parseInt(String(x.Nominal||0).replace(/[^0-9]/g,""))||0,memberName:String(x.Anggota||"").trim(),desc:p.slice(1).join("|").trim()};}).filter(function(x){return x.memberName;});filteredTxs=txs.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);});logD('✅ Tx '+txs.length);}
    saveAll();updateUI();isSyncing=false;if(showToast)toast('✅ Sync: '+txs.length+' trx, '+members.length+' anggota');
  }).catch(function(err){isSyncing=false;logD('❌ '+err.message);if(showToast)toast('Offline');});
}
function updateUI(){
  var list=filteredTxs.length?filteredTxs:txs;var masuk=0;list.forEach(function(t){if(t.category!=="Kas Keluar")masuk+=t.amount;});
  var s=document.getElementById('saldo');if(s)s.textContent='Rp '+fmt(masuk);
  var sd=document.getElementById('saldo-detail');if(sd)sd.textContent=list.length+'/'+txs.length+' trx • '+members.length+' anggota • '+banks.length+' bank';
  var ls=document.getElementById('last-sync');if(ls)ls.textContent='Sync: '+new Date().toLocaleTimeString('id-ID')+' - '+members.length+' anggota dari Sheet';
  var tl=document.getElementById('tx-list');if(tl)tl.innerHTML=list.slice(0,20).map(function(t){return '<div style="background:#F0FDFF;border:1px solid #a5f3fc;border-radius:10px;padding:8px;margin-bottom:6px;font-size:11px"><b>'+t.memberName+'</b> • Rp '+fmt(t.amount)+' • '+t.date+'</div>';}).join('');
  var al=document.getElementById('anggota-list');if(al){
    var map={};members.forEach(function(m){map[m.name]={total:0,count:0};});list.forEach(function(t){if(map[t.memberName]){map[t.memberName].total+=t.amount;map[t.memberName].count++;}});
    var arr=Object.keys(map).map(function(k){return {name:k,total:map[k].total,count:map[k].count};}).sort(function(a,b){return b.total-a.total;});
    var min=arr.length?Math.min.apply(null,arr.map(function(x){return x.total;})):0;
    al.innerHTML=arr.map(function(m){var isMin=m.total===min;var bg=isMin?'#FFE4E6':'#ecfeff';var bd=isMin?'#fda4af':'#22d3ee';var label=isMin?'<div style="font-size:7px;background:#ef4444;color:#fff;padding:2px 6px;border-radius:999px;display:inline-block;margin-bottom:4px">TERKECIL</div>':'';return '<div style="background:'+bg+';border:1.5px solid '+bd+';border-radius:12px;padding:10px;text-align:center">'+label+'<div style="font-weight:900;font-size:12px">'+m.name+'</div><div style="font-size:11px">Rp '+fmt(m.total)+'</div></div>';}).join('');
  }
  var rl=document.getElementById('rekening-list');if(rl)rl.innerHTML=banks.map(function(b){return '<div style="background:#fff;border:1px solid #a5f3fc;border-radius:12px;padding:12px;margin-bottom:8px"><div style="font-weight:900;color:#0e7490">'+b.name+'</div><div style="font-family:monospace;font-size:18px;cursor:pointer" onclick="copyRek(\''+b.number+'\',\''+b.name+'\')">'+b.number+'</div><button class="btn btn-teal" style="width:100%;margin-top:6px" onclick="copyRek(\''+b.number+'\',\''+b.name+'\')">📋 Copy</button></div>';}).join('');
  var ac=document.getElementById('anggota-count');if(ac)ac.textContent=members.length;
}
try{updateUI();setTab('dashboard');setTimeout(function(){syncNow(false);},800);}catch(e){logD('Init err '+e.message);}
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
